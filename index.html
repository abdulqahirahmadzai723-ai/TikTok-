<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>خوندي انلاین ټیک ټاک اپلیکیشن</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #000; color: #fff; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; }
        
        header { width: 100%; max-width: 480px; background: rgba(18, 18, 18, 0.9); backdrop-filter: blur(10px); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; z-index: 100; position: absolute; top: 0; }
        header h2 { font-size: 18px; background: linear-gradient(45deg, #fe2c55, #25f4ee); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #user-status { font-size: 12px; color: #00ffcc; background: #1a1a1a; padding: 4px 10px; border-radius: 20px; border: 1px solid #00ffcc33; }

        .panel-box { width: 90%; max-width: 420px; background: #161616; padding: 20px; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); border: 1px solid #2a2a2a; z-index: 200; position: absolute; top: 22%; }
        .panel-box h3 { margin-bottom: 15px; font-size: 18px; text-align: center; }
        input, button { width: 100%; padding: 12px 15px; margin: 8px 0; border-radius: 8px; border: none; font-size: 14px; outline: none; }
        input { background: #222; color: #fff; border: 1px solid #333; }
        input:focus { border-color: #fe2c55; }
        button { background: #fe2c55; color: #fff; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { background: #e0244a; }
        .secondary-btn { background: #333; }
        .secondary-btn:hover { background: #444; }

        #video-feed { width: 100%; max-width: 480px; height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; background: #000; position: relative; }
        .video-item { width: 100%; height: 100vh; scroll-snap-align: start; position: relative; display: flex; justify-content: center; align-items: center; }
        .video-item video { width: 100%; height: 100%; object-fit: cover; }
        
        .video-info { position: absolute; bottom: 30px; right: 20px; left: 90px; z-index: 5; text-shadow: 0 1px 4px rgba(0,0,0,0.9); }
        .video-info h3 { font-size: 16px; margin-bottom: 6px; }
        .video-info p { font-size: 14px; color: #ddd; }

        .video-actions { position: absolute; bottom: 30px; left: 15px; z-index: 5; display: flex; flex-direction: column; align-items: center; gap: 18px; }
        .action-btn { background: rgba(30, 30, 30, 0.6); backdrop-filter: blur(5px); border: none; color: #fff; width: 48px; height: 48px; border-radius: 50%; cursor: pointer; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 20px; }
        .action-btn span { font-size: 11px; margin-top: 2px; font-weight: bold; }

        .comments-drawer { position: absolute; bottom: -100%; left: 0; width: 100%; max-width: 480px; height: 60vh; background: #181818; border-top-left-radius: 20px; border-top-right-radius: 20px; z-index: 1000; transition: bottom 0.3s ease-in-out; display: flex; flex-direction: column; border-top: 1px solid #333; }
        .comments-drawer.active { bottom: 0; }
        .drawer-header { padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2a2a; font-weight: bold; }
        .close-drawer { background: none; border: none; color: #aaa; font-size: 18px; cursor: pointer; width: auto; padding: 0; }
        .comments-list { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .comment-item { background: #222; padding: 10px 12px; border-radius: 10px; font-size: 13px; }
        .comment-item strong { color: #25f4ee; display: block; margin-bottom: 3px; }
        .drawer-footer { padding: 12px; background: #121212; display: flex; gap: 10px; border-top: 1px solid #2a2a2a; }
        .drawer-footer input { margin: 0; flex: 1; }
        .drawer-footer button { width: 80px; margin: 0; }

        .floating-upload-btn { position: absolute; bottom: 25px; right: 25px; z-index: 50; background: linear-gradient(45deg, #fe2c55, #ff4d6d); color: #fff; border: none; width: 55px; height: 55px; border-radius: 50%; font-size: 26px; box-shadow: 0 4px 15px rgba(254,44,85,0.5); cursor: pointer; display: flex; justify-content: center; align-items: center; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <h2>TikTok Live</h2>
        <span id="user-status">مهمان</span>
    </header>

    <div id="auth-container" class="panel-box">
        <h3>حساب ته ننوتل</h3>
        <input type="email" id="email" placeholder="ایمیل پته (Email)">
        <input type="password" id="password" placeholder="پټه کلمه (Password)">
        <button onclick="signIn()">ننوتل (Login)</button>
        <button class="secondary-btn" onclick="signUp()">نوی اکاونټ (Register)</button>
    </div>

    <div id="upload-panel" class="panel-box hidden">
        <h3>نوی ویډیو اپلوډ</h3>
        <input type="text" id="caption" placeholder="د ویډیو په اړه توضیحات...">
        <input type="file" id="videoFile" accept="video/*" style="background:none; border:none; padding:5px 0;">
        <button onclick="uploadVideo()">اپلوډ او خپرول</button>
        <button class="secondary-btn" onclick="toggleUploadPanel()">بندول</button>
        <button class="secondary-btn" style="background:#222; color:#ff4d6d; margin-top:10px;" onclick="signOut()">وتل (Logout)</button>
    </div>

    <div id="video-feed">
        <div style="display:flex; justify-content:center; align-items:center; height:100%; color:#777;">ویډیوګانې بار کیږي...</div>
    </div>

    <button class="floating-upload-btn hidden" id="open-upload-btn" onclick="toggleUploadPanel()">+</button>

    <div id="comments-drawer" class="comments-drawer">
        <div class="drawer-header">
            <span>کمنټونه</span>
            <button class="close-drawer" onclick="closeComments()">✕</button>
        </div>
        <div class="comments-list" id="comments-list"></div>
        <div class="drawer-footer">
            <input type="text" id="comment-input" placeholder="خپل کمنټ ولیکئ...">
            <button onclick="submitComment()">ارسال</button>
        </div>
    </div>

    <script>
        // دلته خپل د فایربیس اصل کیلي (Config) ځای په ځای کړئ
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "SENDER_ID",
            appId: "APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const storage = firebase.storage();
        const auth = firebase.auth();

        let activeVideoId = null;

        auth.onAuthStateChanged((user) => {
            if (user) {
                document.getElementById("user-status").innerText = user.email.split('@')[0];
                document.getElementById("auth-container").classList.add("hidden");
                document.getElementById("open-upload-btn").classList.remove("hidden");
            } else {
                document.getElementById("user-status").innerText = "مهمان";
                document.getElementById("auth-container").classList.remove("hidden");
                document.getElementById("open-upload-btn").classList.add("hidden");
                document.getElementById("upload-panel").classList.add("hidden");
            }
        });

        function signUp() {
            let email = document.getElementById("email").value;
            let pass = document.getElementById("password").value;
            auth.createUserWithEmailAndPassword(email, pass).catch(e => alert(e.message));
        }

        function signIn() {
            let email = document.getElementById("email").value;
            let pass = document.getElementById("password").value;
            auth.signInWithEmailAndPassword(email, pass).catch(e => alert(e.message));
        }

        function signOut() {
            auth.signOut();
        }

        function toggleUploadPanel() {
            document.getElementById("upload-panel").classList.toggle("hidden");
        }

        async function uploadVideo() {
            let fileInput = document.getElementById("videoFile");
            let caption = document.getElementById("caption").value;
            let user = auth.currentUser;

            if (!fileInput.files[0] || !caption) {
                alert("لطفاً فایل او توضیحات بشپړ کړئ!");
                return;
            }

            let file = fileInput.files[0];
            let storageRef = storage.ref(`videos/${Date.now()}_${file.name}`);
            alert("ویډیو د اپلوډ په حال کې ده...");
            
            let snapshot = await storageRef.put(file);
            let downloadUrl = await snapshot.ref.getDownloadURL();

            await db.collection("videos").add({
                username: user.email.split('@')[0],
                caption: caption,
                videoUrl: downloadUrl,
                likesCount: 0,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            alert("ویډیو په بریالیتوب سره خپره شوه!");
            document.getElementById("caption").value = "";
            document.getElementById("videoFile").value = "";
            toggleUploadPanel();
        }

        function loadVideos() {
            const feed = document.getElementById("video-feed");
            db.collection("videos").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
                feed.innerHTML = "";
                if(snapshot.empty) {
                    feed.innerHTML = "<div style='display:flex; justify-content:center; align-items:center; height:100%; color:#777;'>هیڅ ویډیو نشته!</div>";
                    return;
                }

                snapshot.forEach((doc) => {
                    let data = doc.data();
                    let videoId = doc.id;

                    let div = document.createElement("div");
                    div.className = "video-item";
                    div.innerHTML = `
                        <video src="${data.videoUrl}" loop playsinline onclick="this.paused ? this.play() : this.pause()"></video>
                        <div class="video-info">
                            <h3>@${data.username}</h3>
                            <p>${data.caption}</p>
                        </div>
                        <div class="video-actions">
                            <button class="action-btn" onclick="likeVideo('${videoId}')">❤️<span>${data.likesCount || 0}</span></button>
                            <button class="action-btn" onclick="openComments('${videoId}')">💬<span>کمنټ</span></button>
                        </div>
                    `;
                    feed.appendChild(div);
                });
            });
        }

        function likeVideo(videoId) {
            db.collection("videos").doc(videoId).update({
                likesCount: firebase.firestore.FieldValue.increment(1)
            });
        }

        function openComments(videoId) {
            activeVideoId = videoId;
            document.getElementById("comments-drawer").classList.add("active");
            loadCommentsRealtime(videoId);
        }

        function closeComments() {
            document.getElementById("comments-drawer").classList.remove("active");
            activeVideoId = null;
        }

        function loadCommentsRealtime(videoId) {
            const list = document.getElementById("comments-list");
            db.collection("videos").doc(videoId).collection("comments").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
                list.innerHTML = "";
                if(snapshot.empty) {
                    list.innerHTML = "<p style='color:#777; text-align:center;'>هیڅ کمنټ نشته.</p>";
                    return;
                }
                snapshot.forEach((doc) => {
                    let cData = doc.data();
                    let cDiv = document.createElement("div");
                    cDiv.className = "comment-item";
                    cDiv.innerHTML = `<strong>@${cData.username}</strong>${cData.text}`;
                    list.appendChild(cDiv);
                });
            });
        }

        function submitComment() {
            let text = document.getElementById("comment-input").value;
            let user = auth.currentUser;

            if(!text || !activeVideoId) return;
            if(!user) {
                alert("د کمنټ لپاره لومړی لاګ‌ان شئ!");
                return;
            }

            db.collection("videos").doc(activeVideoId).collection("comments").add({
                username: user.email.split('@')[0],
                text: text,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                document.getElementById("comment-input").value = "";
            });
        }

        window.onload = loadVideos;
    </script>
</body>
</html>
